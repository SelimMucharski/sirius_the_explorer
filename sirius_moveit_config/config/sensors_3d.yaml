# Octomap of the planning scene from the front OAK-D W depth camera (launch arg octomap:=true).
# The clouds come from sirius_navigation/obstacle_cloud (base_link, arm points removed):
# ground = points near the local ground (terrain, probes, low stones), obstacles = higher points.
# The map is kept in odom: smooth (wheels + IMU), without the GNSS corrections of map.
octomap_frame: odom
octomap_resolution: 0.02
max_range: 2.5
sensors: [front_ground, front_obstacles]
front_ground:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /front/ground
  max_range: 2.5
  point_subsample: 1
  padding_offset: 0.02
  padding_scale: 1.0
  max_update_rate: 2.0
  filtered_cloud_topic: ''
front_obstacles:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /front/obstacles
  max_range: 2.5
  point_subsample: 1
  padding_offset: 0.02
  padding_scale: 1.0
  max_update_rate: 2.0
  filtered_cloud_topic: ''
