# Joint limits for motion planning.
# These shadow the URDF limits and can be made more conservative.

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0

  joint_2:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0

  joint_3:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0

  joint_4:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0

  joint_5:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0

  joint_6:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0

  joint_gripper_left:
    # working range; the URDF allows 2 mm more on each side (see 6DOF.urdf.xacro)
    has_position_limits: true
    min_position: 0.0
    max_position: 0.0326
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.5

  joint_gripper_right:
    # working range; the URDF allows 2 mm more on each side (see 6DOF.urdf.xacro)
    has_position_limits: true
    min_position: 0.0
    max_position: 0.0326
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.5
