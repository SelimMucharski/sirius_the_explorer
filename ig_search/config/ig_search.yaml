# Parametry węzła ig_search (wartości domyślne z ig_search/domain/params.py).
# Opis każdego pola: komentarze w params.py. Ścieżki względne - względem share/ig_search/config.
ig_search:
  ros__parameters:
    heightmap: maps/erc2025_heightmap.yaml
    traversability_map: maps/erc2025_traversability.yaml   # '' - bez mapy przejezdności
    cache_dir: ~/.cache/ig_search
    # skalowanie prędkości ramienia: przy 1.0 kontroler w symulacji (RTF ~0,35) nie nadążał
    # (move_group: „Controller is taking too long”), ramię ścinało tor i chwytak uderzał
    # w grunt przy schylaniu (2026-10-26) - 0,5 jak wcześniej; z próbką przyspawaną w symulacji
    # bez dawnego zwolnienia do 0,2
    arm_velocity_scaling: 0.5
    arm_carry_scaling: 0.5
    camera:
      hfov_deg: 96.8
      vfov_deg: 64.7
      r_min: 0.3
      r_max: 6.0
      mount_x: 0.223
      mount_z: 0.392
      mount_pitch_deg: 0.0
      target_height: 0.03
      occlusion_margin: 0.02
      occlusion_step: 0.1
      occlusion_skip_end: 0.25
    detector:
      pd_max: 0.85
      r_full: 2.5
      edge_falloff: 0.3
      sigma0: 0.05
      sigma1: 0.04
      lambda_fa: 0.0035
      calibration_file: calib/detector_front.yaml   # M6
    belief:
      cell_size: 0.2
      n_samples: 3
      ell_min: -12.0
      ell_max: 12.0
      gate_dir_buckets: 8
      gate_range_ratio: 1.5
      gate_range_min: 0.3
      prior_max_slope_deg: 35.0
      detection_window_sigmas: 3.0
      explain_away: true
    travel:
      v_max: 1.0        # jak linear_vel w navigation.launch.py (przyspieszenie 2026-10-26)
      w_max: 1.0
      t_overhead: 2.0
      slope_max_deg: 20.0
      uphill_cost: 2.0
      downhill_cost: 0.5
      robot_radius: 0.55
      roughness_max: 0.12
    views:
      vp_step: 1.0
      n_yaw: 8
      edge_clearance: 0.0     # [m] pozy obserwacji od terenu nieprzejezdnego; 0 - wyłączone
    candidates:
      p_seed: 0.02
      approach_distance: 0.78
      front_verify_distance: 1.15
      n_approach_dirs: 8
      t_verify: 15.0
      p_abandon: 0.05
      block_time: 90.0
    report:
      thresholds:
      - 0.8
      - 0.85
      - 0.95
      epsilon: 0.15
      clear_radius: 0.4
      workspace_root_x: 0.1145
      workspace_r_min: 0.6
      workspace_dz:
      - -0.06
      - -0.03
      - 0.0
      - 0.015
      - 0.03
      - 0.06
      workspace_r_max_dz:
      - 0.62
      - 0.68
      - 0.72
      - 0.74
      - 0.76
      - 0.78
      workspace_half_angle_deg: 75.0
      reach_margin: 0.035
      reach_angle_margin_deg: 10.0
      max_verify_attempts: 2
    planner:
      strategy: ig_greedy
      hysteresis: 0.25
      replan_period: 3.0
      min_gain: 0.0001
      horizon_depth: 3
      beam_width: 10
      beam_candidates: 20
      approach_threshold: 0.5
      meander_overlap: 0.2
      meander_waypoint_step: 2.0
      waypoint_reached: 1.0
      frontier_min_gain: 3.0
      coverage_passes: 0
    mission:
      t_max: 1800.0
      score_steps: [450.0, 750.0, 1050.0, 1350.0]
      score_factors: [1.0, 0.9, 0.8, 0.7, 0.6]
      use_wrist: true
    wrist:
      scan_height: 0.5
      scan_timeout: 25.0
      pregrasp_timeout: 25.0
      pregrasp_height: 0.05
      grasp_depth: 0.012
      grasp: true
      grasp_timeout: 40.0
      match_radius: 0.3
    wrist_camera:
      hfov_deg: 70.5
      vfov_deg: 47.7
      r_min: 0.1
      r_max: 1.2
      mount_x: 0.0
      mount_z: 0.0
      mount_pitch_deg: 0.0
      target_height: 0.03
      occlusion_margin: 0.02
      occlusion_step: 0.03
      occlusion_skip_end: 0.05
    wrist_detector:
      pd_max: 0.95
      r_full: 0.7
      edge_falloff: 0.2
      sigma0: 0.01
      sigma1: 0.02
      lambda_fa: 0.08
      calibration_file: calib/detector_wrist.yaml   # M6
