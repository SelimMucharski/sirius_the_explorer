# Detektory próbek dla ig_search: jak probe_detector/config/probe_detectors.yaml,
# ale w ramce optycznej: ig_search czeka na TF na czas klatki (przy obciążonym CPU EKF/GNSS
# się spóźniają, a detektor z target_frame: map porzucał wtedy całe klatki).
# weights: a relative path is relative to this package's share directory.
/front/probe_detector:
  ros__parameters:
    weights: models/probe_front_oak_d_w.pt   # OAK-D W front camera, 640x360
    imgsz: 640
    detector_conf: 0.25
    min_score: 0.3          # validation (gz_front_v2, erc2025_real): recall 0.83, 0.08 FP / image
    max_spread: 0.08
    duplicate_distance: 0.06
    target_frame: ''          # ramka optyczna; do map przelicza ig_search (bufor TF)
    publish_debug_image: false

/wrist/probe_detector:
  ros__parameters:
    weights: models/probe_wrist_oak_d_sr.pt  # OAK-D SR wrist camera, 1280x800
    imgsz: 960
    detector_conf: 0.25
    min_score: 0.3          # validation (gz_wrist_v2, erc2025_real): recall 0.96, 0.04 FP / image
    max_spread: 0.05
    duplicate_distance: 0.06  # a probe split by a gripper jaw gives two boxes
    target_frame: ''          # ramka optyczna; do map przelicza ig_search (bufor TF)
    publish_debug_image: false
