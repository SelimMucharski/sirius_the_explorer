# Unity simulation variant of the sirius_navigation sensor fusion (robot_localization).
# odom EKF: wheel odometry (/odometry/wheels) + IMU; with use_gps:=true also a map EKF
# fed by navsat_transform (GPS). Visual SLAM / ArUco inputs of the real robot
# (/slam/global_odometry, /marker_based_localization/pose) are not simulated.
ekf_odom:
  ros__parameters:
    frequency: 50.0
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    acceleration_limits: [8.0, 0.0, 0.0, 0.0, 0.0, 14.15929203539823]
    deceleration_limits: [8.0, 0.0, 0.0, 0.0, 0.0, 14.15929203539823]

    odom0: /odometry/wheels
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true

    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: true

ekf_map:
  ros__parameters:
    frequency: 20.0
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    smooth_lagged_data: true
    history_length: 0.5

    odom0: /odometry/wheels
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 8
    odom1_nodelay: true

    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

navsat_transform:
  ros__parameters:
    frequency: 20.0
    delay: 0.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
