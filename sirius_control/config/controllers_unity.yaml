# ros2_control configuration for the Unity simulation (unity_sim).
# Same controllers and names as sirius_description/config/controllers.yaml (Gazebo /
# real robot); differences:
#  * diff_drive_controller (Jazzy) accepts geometry_msgs/TwistStamped only, so
#    use_stamped_vel is dropped; /cmd_vel is TwistStamped,
#  * odometry TF is published by robot_localization (EKF), not by the controller,
#  * wheel_separation_multiplier models skid-steer slip measured in Unity against
#    /sirius/ground_truth (the real rover calibration in the ROS 1 config was ~2.0).
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz; Unity physics also runs at 50 Hz (Fixed Timestep 0.02 s)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    sirius_base_controller:
      type: diff_drive_controller/DiffDriveController

    manip_controller:
      type: joint_trajectory_controller/JointTrajectoryController

sirius_base_controller:
  ros__parameters:
    left_wheel_names:  ["front_left_wheel_joint", "back_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "back_right_wheel_joint"]

    wheel_separation: 0.577
    wheel_radius:     0.110
    wheel_separation_multiplier: 1.43  # Unity: wheel-odom yaw / ground-truth yaw (147 deg / 102.5 deg)
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id:  odom
    base_frame_id:  base_link
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.01, 0.01, 0.05, 0.01, 0.01, 0.02]

    cmd_vel_timeout: 1.0
    enable_odom_tf: false
    position_feedback: true

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.25
    linear.x.min_acceleration: -1.25

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 3.14
    angular.z.min_acceleration: -3.14

manip_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    # Path tolerance is looser than on the robot: commands reach Unity over rosbridge
    # with occasional ~1 s latency spikes at the start of a goal.
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
      joint_1: {trajectory: 0.5, goal: 0.05}
      joint_2: {trajectory: 0.5, goal: 0.05}
      joint_3: {trajectory: 0.5, goal: 0.05}
      joint_4: {trajectory: 0.5, goal: 0.05}
      joint_5: {trajectory: 0.5, goal: 0.05}
      joint_6: {trajectory: 0.5, goal: 0.05}
